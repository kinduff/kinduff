actice mode · Dixie Kong</text><circle cx="355" cy="150" r="8" class="tl-on"/><text x="355" y="175" class="tl-d" text-anchor="middle">17</text><line x1="355" x2="355" y1="140" y2="70" class="tl-k"/><text x="349" y="46" class="tl-t">shaders, turbo,</text><text x="349" y="62" class="tl-t">settings menu</text><circle cx="433.8" cy="150" r="9" class="tl-rel"/><text x="433.8" y="175" class="tl-d" text-anchor="middle">18</text><line x1="433.8" x2="433.8" y1="185" y2="215" class="tl-k"/><text x="427.8" y="232" class="tl-t">intro song fixed</text><text x="427.8" y="248" class="tl-t">v0.1.0: Linux,</text><text x="427.8" y="264" class="tl-t">Windows, Mac</text><circle cx="512.5" cy="150" r="8" class="tl-on"/><circle cx="591.2" cy="150" r="9" class="tl-rel"/><circle cx="670" cy="150" r="9" class="tl-rel"/><text x="512.5" y="175" class="tl-d" text-anchor="middle">19</text><text x="591.2" y="175" class="tl-d" text-anchor="middle">20</text><text x="670" y="175" class="tl-d" text-anchor="middle">21</text><line x1="512.5" x2="512.5" y1="140" y2="110" class="tl-k"/><text x="506.5" y="86" class="tl-t">widescreen,</text><text x="506.5" y="102" class="tl-t">v0.3.0, v0.3.1</text></svg>