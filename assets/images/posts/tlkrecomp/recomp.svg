<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" role="img" aria-label="The cartridge's game code is translated to C and compiled into a native program; the picture and sound chips are still emulated next to it">
  <style>
    .rc-t { fill: var(--font-color, #0e0e0b); font-size: 14px; }
    .rc-s { fill: var(--font-color, #0e0e0b); font-size: 12px; opacity: .75; }
    .rc-l { stroke: var(--font-color, #0e0e0b); stroke-width: 1.5; fill: none; }
    .rc-a { fill: var(--font-color, #0e0e0b); }
    .rc-1 { fill: var(--header-h3-bg-color, #F1C40F); }
    .rc-2 { fill: var(--header-h1-bg-color, #AFD2E9); }
    .rc-3 { fill: var(--header-h4-bg-color, #D4E6B5); }
    .rc-4 { fill: var(--header-h2-bg-color, #C09FE4); }
  </style>
  <defs>
    <marker id="rc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="rc-a"/>
    </marker>
  </defs>

  <rect x="10" y="30" width="140" height="70" rx="8" class="rc-1"/>
  <text x="80" y="60" text-anchor="middle" class="rc-t">The cartridge</text>
  <text x="80" y="80" text-anchor="middle" class="rc-s">1994 machine code</text>

  <rect x="190" y="30" width="140" height="70" rx="8" class="rc-2"/>
  <text x="260" y="60" text-anchor="middle" class="rc-t">Translator</text>
  <text x="260" y="80" text-anchor="middle" class="rc-s">snesrecomp</text>

  <rect x="370" y="30" width="140" height="70" rx="8" class="rc-2"/>
  <text x="440" y="60" text-anchor="middle" class="rc-t">C code</text>
  <text x="440" y="80" text-anchor="middle" class="rc-s">readable, moddable</text>

  <rect x="550" y="30" width="140" height="70" rx="8" class="rc-3"/>
  <text x="620" y="60" text-anchor="middle" class="rc-t">A real PC program</text>
  <text x="620" y="80" text-anchor="middle" class="rc-s">Linux, Windows, Mac</text>

  <line x1="150" y1="65" x2="188" y2="65" class="rc-l" marker-end="url(#rc-arrow)"/>
  <line x1="330" y1="65" x2="368" y2="65" class="rc-l" marker-end="url(#rc-arrow)"/>
  <line x1="510" y1="65" x2="548" y2="65" class="rc-l" marker-end="url(#rc-arrow)"/>

  <rect x="550" y="160" width="140" height="70" rx="8" class="rc-4"/>
  <text x="620" y="190" text-anchor="middle" class="rc-t">Picture + sound</text>
  <text x="620" y="210" text-anchor="middle" class="rc-s">still emulated chips</text>
  <line x1="620" y1="158" x2="620" y2="102" class="rc-l" marker-start="url(#rc-arrow)" marker-end="url(#rc-arrow)"/>

  <text x="10" y="180" class="rc-t">The game's brain becomes C and runs at full speed.</text>
  <text x="10" y="202" class="rc-t">Its eyes and ears stay emulated, so it looks and</text>
  <text x="10" y="224" class="rc-t">sounds like the cartridge.</text>
</svg>
