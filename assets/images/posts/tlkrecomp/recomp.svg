<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="The cartridge's game code is translated to C and compiled into a native program; the picture and sound chips are still emulated next to it" role="img" viewBox="0 0 700 250"><style>.rc-s,.rc-t{fill:var(--font-color, #0e0e0b)}.rc-t{font-size:14px}.rc-s{font-size:12px;opacity:.75}.rc-l{stroke:var(--font-color, #0e0e0b);stroke-width:1.5;fill:none}.rc-a{fill:var(--font-color, #0e0e0b)}.rc-1{fill:var(--header-h3-bg-color, #F1C40F)}.rc-2{fill:var(--header-h1-bg-color, #AFD2E9)}.rc-3{fill:var(--header-h4-bg-color, #D4E6B5)}.rc-4{fill:var(--header-h2-bg-color, #C09FE4)}</style><defs><marker id="rc-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" class="rc-a"/></marker></defs><rect width="140" height="70" x="10" y="30" class="rc-1" rx="8"/><text x="80" y="60" class="rc-t" text-anchor="middle">The cartridge</text><text x="80" y="80" class="rc-s" text-anchor="middle">1994 machine code</text><rect width="140" height="70" x="190" y="30" class="rc-2" rx="8"/><text x="260" y="60" class="rc-t" text-anchor="middle">Translator</text><text x="260" y="80" class="rc-s" text-anchor="middle">snesrecomp</text><rect width="140" height="70" x="370" y="30" class="rc-2" rx="8"/><text x="440" y="60" class="rc-t" text-anchor="middle">C code</text><text x="440" y="80" class="rc-s" text-anchor="middle">readable, moddable</text><rect width="140" height="70" x="550" y="30" class="rc-3" rx="8"/><text x="620" y="60" class="rc-t" text-anchor="middle">A real PC program</text><text x="620" y="80" class="rc-s" text-anchor="middle">Linux, Windows, Mac</text><line x1="150" x2="188" y1="65" y2="65" marker-end="url(#rc-arrow)" class="rc-l"/><line x1="330" x2="368" y1="65" y2="65" marker-end="url(#rc-arrow)" class="rc-l"/><line x1="510" x2="548" y1="65" y2="65" marker-end="url(#rc-arrow)" class="rc-l"/><rect width="140" height="70" x="550" y="160" class="rc-4" rx="8"/><text x="620" y="190" class="rc-t" text-anchor="middle">Picture + sound</text><text x="620" y="210" class="rc-s" text-anchor="middle">still emulated chips</text><line x1="620" x2="620" y1="158" y2="102" marker-end="url(#rc-arrow)" marker-start="url(#rc-arrow)" class="rc-l"/><text x="10" y="180" class="rc-t">The game&apos;s brain becomes C and runs at full speed.</text><text x="10" y="202" class="rc-t">Its eyes and ears stay emulated, so it looks and</text><text x="10" y="224" class="rc-t">sounds like the cartridge.</text></svg>