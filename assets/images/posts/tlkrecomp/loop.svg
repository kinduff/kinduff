<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="The working loop: a goal is picked, a coordinator agent splits it into tasks, workers do them in their own copies, gates compare the result against the original game, the coordinator merges, and a person plays it. Anything that differs goes back to the workers." role="img" viewBox="0 0 700 430"><style>.lp-s,.lp-t{fill:var(--font-color, #0e0e0b)}.lp-t{font-size:14px}.lp-s{font-size:12px;opacity:.75}.lp-d,.lp-l{stroke-width:1.5;fill:none}.lp-l{stroke:var(--font-color, #0e0e0b)}.lp-d{stroke:var(--site-title-color, #B72D2D);stroke-dasharray:5 4}.lp-dt{fill:var(--site-title-color, #B72D2D);font-size:12px}.lp-a{fill:var(--font-color, #0e0e0b)}.lp-ar{fill:var(--site-title-color, #B72D2D)}.lp-me{fill:var(--header-h3-bg-color, #F1C40F)}.lp-ag{fill:var(--header-h1-bg-color, #AFD2E9)}.lp-ch{fill:var(--header-h4-bg-color, #D4E6B5)}.lp-w{fill:var(--header-h2-bg-color, #C09FE4)}</style><defs><marker id="lp-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" class="lp-a"/></marker><marker id="lp-arrow-r" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" class="lp-ar"/></marker></defs><rect width="200" height="74" x="20" y="20" class="lp-me" rx="8"/><text x="120" y="48" class="lp-t" text-anchor="middle">Start</text><text x="120" y="70" class="lp-s" text-anchor="middle">pick the next goal</text><rect width="200" height="74" x="480" y="20" class="lp-ag" rx="8"/><text x="580" y="48" class="lp-t" text-anchor="middle">Coordinator agent</text><text x="580" y="70" class="lp-s" text-anchor="middle">splits it into lettered tasks</text><rect width="200" height="74" x="480" y="170" class="lp-w" rx="8"/><text x="580" y="198" class="lp-t" text-anchor="middle">Worker agents</text><text x="580" y="220" class="lp-s" text-anchor="middle">each in its own copy</text><rect width="200" height="74" x="250" y="170" class="lp-ch" rx="8"/><text x="350" y="198" class="lp-t" text-anchor="middle">Gates</text><text x="350" y="220" class="lp-s" text-anchor="middle">same frames as the original?</text><rect width="200" height="74" x="20" y="170" class="lp-ag" rx="8"/><text x="120" y="198" class="lp-t" text-anchor="middle">Merge + rerun gates</text><text x="120" y="220" class="lp-s" text-anchor="middle">by the coordinator</text><rect width="200" height="74" x="20" y="320" class="lp-me" rx="8"/><text x="120" y="348" class="lp-t" text-anchor="middle">Play test</text><text x="120" y="370" class="lp-s" text-anchor="middle">real window, controller, ears</text><line x1="222" x2="476" y1="57" y2="57" marker-end="url(#lp-arrow)" class="lp-l"/><line x1="580" x2="580" y1="96" y2="166" marker-end="url(#lp-arrow)" class="lp-l"/><line x1="478" x2="454" y1="207" y2="207" marker-end="url(#lp-arrow)" class="lp-l"/><line x1="248" x2="224" y1="207" y2="207" marker-end="url(#lp-arrow)" class="lp-l"/><line x1="120" x2="120" y1="246" y2="316" marker-end="url(#lp-arrow)" class="lp-l"/><path marker-end="url(#lp-arrow)" d="M18,357 L4,357 L4,57 L16,57" class="lp-l"/><path marker-end="url(#lp-arrow-r)" d="M350,246 L350,290 L560,290 L560,248" class="lp-d"/><text x="356" y="308" class="lp-dt">differs: find the first different frame, fix, again</text><path marker-end="url(#lp-arrow-r)" d="M222,357 L660,357 L660,248" class="lp-d"/><text x="440" y="378" class="lp-dt" text-anchor="middle">anything wrong on screen goes straight back</text></svg>