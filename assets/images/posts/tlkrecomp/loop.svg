<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="100%" role="img" aria-label="The working loop: a goal is picked, a coordinator agent splits it into tasks, workers do them in their own copies, gates compare the result against the original game, the coordinator merges, and a person plays it. Anything that differs goes back to the workers.">
  <style>
    .lp-t { fill: var(--font-color, #0e0e0b); font-size: 14px; }
    .lp-s { fill: var(--font-color, #0e0e0b); font-size: 12px; opacity: .75; }
    .lp-l { stroke: var(--font-color, #0e0e0b); stroke-width: 1.5; fill: none; }
    .lp-d { stroke: var(--site-title-color, #B72D2D); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .lp-dt { fill: var(--site-title-color, #B72D2D); font-size: 12px; }
    .lp-a { fill: var(--font-color, #0e0e0b); }
    .lp-ar { fill: var(--site-title-color, #B72D2D); }
    .lp-me { fill: var(--header-h3-bg-color, #F1C40F); }
    .lp-ag { fill: var(--header-h1-bg-color, #AFD2E9); }
    .lp-ch { fill: var(--header-h4-bg-color, #D4E6B5); }
    .lp-w { fill: var(--header-h2-bg-color, #C09FE4); }
  </style>
  <defs>
    <marker id="lp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="lp-a"/>
    </marker>
    <marker id="lp-arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="lp-ar"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="20" y="20" width="200" height="74" rx="8" class="lp-me"/>
  <text x="120" y="48" text-anchor="middle" class="lp-t">Start</text>
  <text x="120" y="70" text-anchor="middle" class="lp-s">pick the next goal</text>

  <!-- coordinator -->
  <rect x="480" y="20" width="200" height="74" rx="8" class="lp-ag"/>
  <text x="580" y="48" text-anchor="middle" class="lp-t">Coordinator agent</text>
  <text x="580" y="70" text-anchor="middle" class="lp-s">splits it into lettered tasks</text>

  <!-- workers -->
  <rect x="480" y="170" width="200" height="74" rx="8" class="lp-w"/>
  <text x="580" y="198" text-anchor="middle" class="lp-t">Worker agents</text>
  <text x="580" y="220" text-anchor="middle" class="lp-s">each in its own copy</text>

  <!-- gates -->
  <rect x="250" y="170" width="200" height="74" rx="8" class="lp-ch"/>
  <text x="350" y="198" text-anchor="middle" class="lp-t">Gates</text>
  <text x="350" y="220" text-anchor="middle" class="lp-s">same frames as the original?</text>

  <!-- merge -->
  <rect x="20" y="170" width="200" height="74" rx="8" class="lp-ag"/>
  <text x="120" y="198" text-anchor="middle" class="lp-t">Merge + rerun gates</text>
  <text x="120" y="220" text-anchor="middle" class="lp-s">by the coordinator</text>

  <!-- window -->
  <rect x="20" y="320" width="200" height="74" rx="8" class="lp-me"/>
  <text x="120" y="348" text-anchor="middle" class="lp-t">Play test</text>
  <text x="120" y="370" text-anchor="middle" class="lp-s">real window, controller, ears</text>

  <!-- flow -->
  <line x1="222" y1="57" x2="476" y2="57" class="lp-l" marker-end="url(#lp-arrow)"/>
  <line x1="580" y1="96" x2="580" y2="166" class="lp-l" marker-end="url(#lp-arrow)"/>
  <line x1="478" y1="207" x2="454" y2="207" class="lp-l" marker-end="url(#lp-arrow)"/>
  <line x1="248" y1="207" x2="224" y2="207" class="lp-l" marker-end="url(#lp-arrow)"/>
  <line x1="120" y1="246" x2="120" y2="316" class="lp-l" marker-end="url(#lp-arrow)"/>
  <path d="M18,357 L4,357 L4,57 L16,57" class="lp-l" marker-end="url(#lp-arrow)"/>

  <!-- differs -->
  <path d="M350,246 L350,290 L560,290 L560,248" class="lp-d" marker-end="url(#lp-arrow-r)"/>
  <text x="356" y="308" class="lp-dt">differs: find the first different frame, fix, again</text>

  <path d="M222,357 L660,357 L660,248" class="lp-d" marker-end="url(#lp-arrow-r)"/>
  <text x="440" y="378" text-anchor="middle" class="lp-dt">anything wrong on screen goes straight back</text>
</svg>
