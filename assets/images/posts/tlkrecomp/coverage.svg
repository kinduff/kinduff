<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="The coverage loop: speedrun tapes drive the game in the emulator, every routine the game enters is logged, new entry points go to the translator, the game is recompiled, and the compiled build is compared frame by frame with the emulator. Each turn grew the compiled routines, from 24 to 1,305." role="img" viewBox="0 0 700 330"><style>.cv-t{font-size:14px}.cv-n,.cv-s,.cv-t{fill:var(--font-color, #0e0e0b)}.cv-s{font-size:12px;opacity:.75}.cv-n{font-size:22px;font-weight:700}.cv-l{stroke:var(--font-color, #0e0e0b);stroke-width:1.5;fill:none}.cv-a{fill:var(--font-color, #0e0e0b)}.cv-1{fill:var(--header-h3-bg-color, #F1C40F)}.cv-2{fill:var(--header-h1-bg-color, #AFD2E9)}.cv-3{fill:var(--header-h4-bg-color, #D4E6B5)}.cv-4{fill:var(--header-h2-bg-color, #C09FE4)}</style><defs><marker id="cv-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" class="cv-a"/></marker></defs><rect width="200" height="74" x="20" y="20" class="cv-1" rx="8"/><text x="120" y="48" class="cv-t" text-anchor="middle">Speedrun tapes</text><text x="120" y="70" class="cv-s" text-anchor="middle">a ghost holding the controller</text><rect width="200" height="74" x="250" y="20" class="cv-4" rx="8"/><text x="350" y="48" class="cv-t" text-anchor="middle">Run in the emulator</text><text x="350" y="70" class="cv-s" text-anchor="middle">log every routine entered</text><rect width="200" height="74" x="480" y="20" class="cv-2" rx="8"/><text x="580" y="48" class="cv-t" text-anchor="middle">New entry points</text><text x="580" y="70" class="cv-s" text-anchor="middle">handed to the translator</text><rect width="200" height="74" x="480" y="170" class="cv-2" rx="8"/><text x="580" y="198" class="cv-t" text-anchor="middle">Recompile</text><text x="580" y="220" class="cv-s" text-anchor="middle">more of the game becomes C</text><rect width="200" height="74" x="250" y="170" class="cv-3" rx="8"/><text x="350" y="198" class="cv-t" text-anchor="middle">Compare</text><text x="350" y="220" class="cv-s" text-anchor="middle">compiled vs. emulated</text><line x1="222" x2="246" y1="57" y2="57" marker-end="url(#cv-arrow)" class="cv-l"/><line x1="452" x2="476" y1="57" y2="57" marker-end="url(#cv-arrow)" class="cv-l"/><line x1="580" x2="580" y1="96" y2="166" marker-end="url(#cv-arrow)" class="cv-l"/><line x1="478" x2="454" y1="207" y2="207" marker-end="url(#cv-arrow)" class="cv-l"/><path marker-end="url(#cv-arrow)" d="M248,207 L120,207 L120,98" class="cv-l"/><text x="128" y="160" class="cv-s">same? next tape</text><text x="20" y="290" class="cv-n">24</text><text x="58" y="290" class="cv-s">routines on the first try</text><text x="250" y="290" class="cv-n">1,305</text><text x="318" y="290" class="cv-s">routines compiled at the end</text><text x="20" y="316" class="cv-s">94.5% of the instructions a whole-game run executes now run as compiled C.</text></svg>